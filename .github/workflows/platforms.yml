# On every push: start CineHaven for real on Linux, Windows and macOS, then build the
# Windows installer and the macOS app and start those too.
# When a GitHub release is published, the installers are attached to it.
name: platforms
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 python3-libtorrent python3-mpv libmpv2 xvfb ffmpeg
      - name: Smoke test
        run: xvfb-run -a env GDK_BACKEND=x11 python3 packaging/smoke_test.py

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-libadwaita
            mingw-w64-ucrt-x86_64-python-gobject
            mingw-w64-ucrt-x86_64-python-pip
            mingw-w64-ucrt-x86_64-mpv
            mingw-w64-ucrt-x86_64-ffmpeg
            mingw-w64-ucrt-x86_64-boost
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python-setuptools
            mingw-w64-ucrt-x86_64-ntldd
            mingw-w64-ucrt-x86_64-nsis
            mingw-w64-ucrt-x86_64-imagemagick
            mingw-w64-ucrt-x86_64-librsvg
            git
            zip
      # MSYS2 ships the libtorrent C++ library but not its Python bindings, so build them
      - name: Cache libtorrent build
        id: lt-cache
        uses: actions/cache@v4
        with:
          path: lt-install
          key: libtorrent-2.1.2-ucrt64-v3
      - name: Build libtorrent Python bindings
        if: steps.lt-cache.outputs.cache-hit != 'true'
        run: |
          # hide the runner's own Python so CMake can only find MSYS2's
          rm -rf /c/hostedtoolcache/windows/Python
          git clone --depth 1 --branch v2.1.2 --recurse-submodules --shallow-submodules https://github.com/arvidn/libtorrent.git lt-src
          cmake -S lt-src -B lt-build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -Dpython-bindings=ON -Dpython-egg-info=OFF -DBUILD_SHARED_LIBS=OFF -Dstatic_runtime=OFF \
            -Dbuild_tests=OFF -Dbuild_examples=OFF -Dbuild_tools=OFF \
            -DPython3_EXECUTABLE="$(cygpath -m "$(command -v python)")" -DPython3_FIND_REGISTRY=NEVER \
            -DPython_EXECUTABLE="$(cygpath -m "$(command -v python)")" -DPython_FIND_REGISTRY=NEVER \
            -DCMAKE_INSTALL_PREFIX="$PWD/lt-install"
          cmake --build lt-build
          cmake --install lt-build
          mkdir -p lt-install/py
          find lt-build lt-install -name "libtorrent*.pyd" -exec cp {} lt-install/py/ \;
          ls -R lt-install | head -50
      - name: Install libtorrent bindings
        run: |
          SITE=$(python -c "import sysconfig; print(sysconfig.get_paths()['platlib'])")
          cp lt-install/py/libtorrent*.pyd "$SITE/"
          cp lt-install/bin/*.dll /ucrt64/bin/ 2>/dev/null || true
          python -c "import libtorrent; print('libtorrent', libtorrent.__version__)"
      - name: Install python-mpv
        run: |
          pip install --break-system-packages python-mpv
          # optional: Chromecast support (casting to DLNA TVs needs nothing extra)
          pip install --break-system-packages pychromecast || echo "pychromecast unavailable – Chromecast casting off"
      - name: Smoke test
        run: python packaging/smoke_test.py
      - name: Build the self-contained bundle
        run: packaging/windows/build.sh
      - name: Start the bundle with nothing else installed
        shell: cmd
        run: |
          set /p BUNDLE=<dist\windows-dir.txt
          set BUNDLE=%BUNDLE:/=\%
          set PATH=C:\Windows\System32;C:\Windows
          "%BUNDLE%\bin\python.exe" "%BUNDLE%\app\packaging\smoke_test.py"
      - name: Build the installer
        run: |
          VER=$(python -c "import re;print(re.search(r'APP_VERSION = \"(.+?)\"', open('cinehaven/__init__.py').read()).group(1))")
          makensis -DVERSION=$VER packaging/windows/installer.nsi
          (cd dist && zip -qr "CineHaven-$VER-windows-portable.zip" "CineHaven-$VER-windows")
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*-windows-setup.exe
            dist/*-windows-portable.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        shell: bash          # the GitHub CLI lives outside MSYS2
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*-windows-setup.exe dist/*-windows-portable.zip --clobber

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install libraries
        run: |
          brew install gtk4 libadwaita pygobject3 mpv libtorrent-rasterbar ffmpeg
          PY=$(brew --prefix)/bin/python3
          echo "PY=$PY" >> $GITHUB_ENV
          $PY -m pip install --break-system-packages python-mpv
          $PY -m pip install --break-system-packages pychromecast || echo "pychromecast unavailable"
          $PY -c "import libtorrent; print('libtorrent', libtorrent.__version__)"
      - name: Smoke test
        env:
          DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib
        run: $PY packaging/smoke_test.py
      - name: Build CineHaven.app
        run: |
          brew install librsvg
          packaging/macos/build.sh
      - name: Start the app
        env:
          DYLD_FALLBACK_LIBRARY_PATH: /opt/homebrew/lib
        run: |
          dist/CineHaven.app/Contents/MacOS/CineHaven --check
          $PY dist/CineHaven.app/Contents/Resources/app/packaging/smoke_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*-macos.zip
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*-macos.zip --clobber

  checksums:
    if: github.event_name == 'release'
    needs: [windows, macos]
    runs-on: ubuntu-24.04
    steps:
      - name: Add the installers to SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          mkdir r && cd r
          gh release download "$TAG" -R "${{ github.repository }}"
          rm -f SHA256SUMS
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$TAG" SHA256SUMS --clobber -R "${{ github.repository }}"
